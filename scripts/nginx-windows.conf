worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Custom log format voor betere analyse
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time';

    server {
        listen 3333;
        server_name localhost 131.174.248.13 _;
        root html;
        index index.html;

        # Logging met detailed format
        access_log logs/access.log detailed;
        error_log logs/error.log;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # HTML files - NOOIT cachen (voorkomt stale cache na updates)
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            # Security headers (moeten herhaald worden in elke location block)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # SPA routing - index.html niet cachen
        location / {
            try_files $uri $uri/ /index.html;
            # Headers voor index.html fallback
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            # Security headers (moeten herhaald worden in elke location block)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Static assets - LANG cachen (bestanden hebben unieke hashes)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            # Security headers (moeten herhaald worden in elke location block)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Favicon en manifest - kort cachen
        location ~* \.(ico|png|svg|webmanifest|json)$ {
            expires 1d;
            add_header Cache-Control "public" always;
            # Security headers (moeten herhaald worden in elke location block)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Gzip compressie
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
}
